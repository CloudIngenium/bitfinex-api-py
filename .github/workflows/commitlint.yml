name: Commit Lint
on:
  pull_request:
    branches: [main, master]

# PP114 (2026-05-15): cancel in-flight runs when a new push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
permissions:
  contents: read
  pull-requests: read
jobs:
  commitlint:
    # Routing por GHA_BUDGET_STAGE vive en el reusable (una sola copia fleet-wide).
    uses: CloudIngenium/.github/.github/workflows/commitlint.yml@8e7f84a3b6d35b93d05726033d5ee036d590bd83 # commitlint-reusable