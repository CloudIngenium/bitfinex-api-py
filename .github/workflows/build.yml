name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # tests/ is linted too. It was not until 2026-09-26, and the drift was
      # already there: an UP035 and an unsorted import block sat in
      # tests/test_wire_contract.py from the day it was written, invisible
      # because the only thing that would have reported them did not look.
      - name: Run ruff linter
        run: ruff check bfxapi/ tests/
      - name: Run ruff formatter check
        run: ruff format --check bfxapi/ tests/
      - name: Run mypy type checking
        run: mypy bfxapi/

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify import
        run: python -c "import bfxapi; print('Import successful')"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v
      - name: Run mypy
        run: mypy bfxapi/
